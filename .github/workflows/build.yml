name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python -m qobuz_rpc.icon assets/icon.ico

      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --noconsole
          --name QobuzRPC --icon assets/icon.ico
          --hidden-import pystray._win32
          run.py

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: QobuzRPC
          path: |
            dist/QobuzRPC-Setup-*.exe
            dist/QobuzRPC.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/QobuzRPC-Setup-*.exe
            dist/QobuzRPC.exe
          generate_release_notes: true
